services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  db-migration:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    environment:
      - DATABASE_URL=file:/app/data/prod.db
    volumes:
      - backend-data:/app/data
    command: bun dist/db/migrate-cli.js
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/prod.db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - COOKIE_DOMAIN=
      - BEHIND_PROXY=false
      # Le plafond de comptes. Passé depuis l'hôte pour qu'il puisse monter
      # sans redéploiement d'image.
      - MAX_USERS=${MAX_USERS:-100}
    env_file:
      - ./backend/.env
    volumes:
      - backend-data:/app/data
      - backend-avatars:/app/avatars
      # Les jaquettes ingérées, écrites par le backend et servies par nginx.
      #
      # Le volume est entièrement dérivé : la source d'une jaquette du catalogue
      # est l'URL distante dans snes-metadata.json, celle d'un upload est le BLOB
      # dans la base. `covers-cli --rebuild` le refait donc de zéro, et il n'a
      # pas besoin d'être sauvegardé.
      - backend-covers:/app/covers
    depends_on:
      db-migration:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:80"
    volumes:
      # En lecture seule : nginx sert ces fichiers, le backend est le seul
      # à les écrire. Le chemin est celui de la `location /covers/`.
      - backend-covers:/var/www/covers:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis-data:
  backend-data:
  backend-covers:
  backend-avatars:
