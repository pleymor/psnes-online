services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/prod.db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - COOKIE_DOMAIN=snes.pleymor.com
    env_file:
      - ./backend/.env
    volumes:
      - backend-data:/app/data
      - backend-roms:/app/roms
      - backend-saves:/app/saves
      - backend-avatars:/app/avatars
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis-data:
  backend-data:
  backend-roms:
  backend-saves:
  backend-avatars:
