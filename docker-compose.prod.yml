services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  db-migration:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    environment:
      - DATABASE_URL=file:/app/data/prod.db
    volumes:
      - backend-data:/app/data
    command: bun dist/db/migrate-cli.js
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/prod.db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - COOKIE_DOMAIN=
      - BEHIND_PROXY=false
    env_file:
      - ./backend/.env
    volumes:
      - backend-data:/app/data
      - backend-avatars:/app/avatars
    depends_on:
      db-migration:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis-data:
  backend-data:
  backend-avatars:
