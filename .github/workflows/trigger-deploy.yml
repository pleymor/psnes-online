name: Trigger Production Deployment

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned, not "1": a floating major tag is what silently moved CI to
      # Bun 1.4.0 and broke the websocket upgrade in production (issue #10).
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # pipefail, or the exit code would be tee's and a red suite would ship.
      - name: Run the test suites
        run: |
          set -o pipefail
          bun run test:all 2>&1 | tee test-output.log

      # Without a built wasm core and a real ROM, some tests skip themselves
      # (see core/test/skip.ts): 16 in determinism/lockstep/match-watch-rom,
      # 1 in compress, 1 in checksum (which wants a zipped ROM on disk). That
      # is expected here -- but the count is pinned, so a NEW silent skip
      # fails the build instead of hiding inside a green run, which is what
      # #8 was. Raise this only alongside the test that explains the rise.
      - name: Check skips against the expected baseline
        run: |
          skipped=$(grep -oE '^ *[0-9]+ skip' test-output.log | awk '{s+=$1} END {print s+0}')
          echo "Skipped: $skipped (expected 18: no wasm core, no test ROM in CI)"
          if [ "$skipped" -gt 18 ]; then
            echo "::error::$skipped tests skipped, expected at most 18."
            exit 1
          fi

  trigger:
    name: Trigger Infrastructure Deployment
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Trigger deployment in infra repo
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.INFRA_DEPLOY_TOKEN }}
          repository: pleymor/psnes-online-infra
          event-type: app-updated
          client-payload: |
            {
              "ref": "${{ github.ref }}",
              "sha": "${{ github.sha }}",
              "triggered_by": "${{ github.actor }}"
            }

      - name: Deployment triggered
        run: |
          echo "✅ Deployment triggered in psnes-online-infra repository"
          echo "Monitor at: https://github.com/pleymor/psnes-online-infra/actions"
