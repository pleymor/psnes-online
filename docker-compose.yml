services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  db-migration:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    environment:
      - DATABASE_URL=file:/app/data/dev.db
    volumes:
      - backend-data:/app/data
      # The image bakes in the migrations it was built with (backend/Dockerfile:
      # COPY backend/migrations ./migrations), and this service runs from the
      # production image. So a migration added since the last build was invisible
      # here: the runner reported "database is up to date" while the new table was
      # missing, and the failure only surfaced later as a query against a table
      # that did not exist. Mounting the directory means a new .sql file is picked
      # up without a rebuild. Read-only: the runner reads these and only writes to
      # the database.
      - ./backend/migrations:/app/migrations:ro
    command: bun dist/db/migrate-cli.js
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/dev.Dockerfile
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=file:/app/data/dev.db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Passé depuis l'hôte, `google` par défaut, pour que le mode dev serve à
      # tester dans un casque : Google refuse les adresses IP privées comme URI
      # de redirection autorisée, et depuis un Quest `localhost` désigne le
      # casque lui-même — donc le retour d'authentification tombe dans le vide.
      # `AUTH_MODE=dev docker compose up -d backend` ouvre la porte à trois
      # utilisateurs de test par un simple POST, sans aucune redirection.
      # env-guard.ts teste l'égalité stricte pour refuser `dev` en production,
      # ce qui reste vrai quelle que soit la valeur passée ici.
      - AUTH_MODE=${AUTH_MODE:-google}
      # La porte sans compte : un lien de salon suffit pour s'asseoir et jouer.
      # Ouverte par défaut - c'est la fonctionnalité - et `off` la referme sans
      # toucher à AUTH_MODE, dont env-guard.ts teste l'égalité stricte pour
      # refuser `dev` en production.
      - ANONYMOUS_JOIN=${ANONYMOUS_JOIN:-on}
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules
      - backend-data:/app/data
      - backend-avatars:/app/avatars
      - ./backend/data/snes-metadata.json:/app/metadata/snes-metadata.json:ro
    # Dependencies are installed once at image build time (backend/dev.Dockerfile),
    # not on every container start. backend-node-modules is a NAMED volume, so it
    # survives both a plain restart and `docker compose up --build`. After changing
    # backend/package.json (or the root package.json / bun.lock), drop it explicitly
    # (do NOT `down -v`, which also wipes the dev database, saves, avatars and redis
    # data — see the frontend service below for its own, different gotcha):
    #   docker compose up --build -d
    #   docker compose rm -sf backend
    #   docker volume rm psnes_backend-node-modules
    #   docker compose up -d backend
    command: sh -c "bun run dev"
    depends_on:
      db-migration:
        condition: service_completed_successfully
      redis:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/dev.Dockerfile
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.svelte-kit
    environment:
      - VITE_API_URL=http://localhost:3000
      - BACKEND_URL=http://backend:3000
      # Passed through from the host, empty by default, so `VITE_HTTPS=1 docker
      # compose up frontend` serves the self-signed cert in frontend/.certs and
      # everything else is unchanged. It exists because WebXR needs a secure
      # context: localhost is one, but a Quest reaches this machine by LAN IP,
      # which is not - and there `navigator.xr` is undefined, so the VR button
      # never appears and it looks like a bug in the app. See vite.config.ts.
      - VITE_HTTPS=${VITE_HTTPS:-}
    # Dependencies come from the image build (frontend/dev.Dockerfile), not from an
    # install at start. Its /app/node_modules above is an ANONYMOUS volume — by
    # default Compose carries an anonymous volume's *data* over from the old
    # container to the new one on recreation, so a plain `--build` alone does NOT
    # pick up a changed frontend/package.json (or root package.json / bun.lock):
    # verified, it silently keeps the stale packages. Force it to reseed from the
    # freshly built image instead:
    #   docker compose up --build -d --renew-anon-volumes
    command: sh -c "bun run dev -- --host"
    depends_on:
      - backend

volumes:
  redis-data:
  backend-data:
  backend-node-modules:
  backend-avatars:
