<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- SNES Controller-inspired icon -->
  <rect width="100" height="100" rx="15" fill="#1a1a2e"/>

  <!-- D-Pad -->
  <g fill="#6c7a89">
    <rect x="20" y="35" width="8" height="20"/>
    <rect x="15" y="40" width="18" height="10"/>
  </g>

  <!-- Buttons -->
  <circle cx="70" cy="45" r="6" fill="#e74c3c"/>
  <circle cx="80" cy="40" r="6" fill="#f39c12"/>
  <circle cx="75" cy="35" r="6" fill="#3498db"/>
  <circle cx="85" cy="35" r="6" fill="#2ecc71"/>

  <!-- Start/Select -->
  <rect x="42" y="58" width="6" height="3" rx="1.5" fill="#95a5a6"/>
  <rect x="52" y="58" width="6" height="3" rx="1.5" fill="#95a5a6"/>

  <!-- Lightning bolt for speed -->
  <path d="M 50 20 L 45 28 L 48 28 L 44 36 L 52 27 L 49 27 Z" fill="#f1c40f"/>
</svg>
