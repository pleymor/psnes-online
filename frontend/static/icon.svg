<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    PSNES app icon: the cassette, for 64px and up.
    The face is the real PAL shell: 130 x 86 mm gives 54 x 35.74 units, a 1.511
    landscape. Everything is a solid fill - the cast shape is a graphic device,
    offset one way while the cassette is offset the other by the same amount, so
    the pair reads centred although neither half is.
  -->
  <rect width="64" height="64" rx="12" fill="#efece3"/>

  <g transform="translate(1.3 1.3)"><path d="M5 20.5C5 15.6 9.6 12.7 15 12.4C23 12.05 41 12.05 49 12.4C54.4 12.7 59 15.6 59 20.5V45.37A2.5 2.5 0 0 1 56.5 47.87H7.5A2.5 2.5 0 0 1 5 45.37Z" fill="#2b2266"/></g>

  <g transform="translate(-1.3 -1.3)">
    <path d="M5 20.5C5 15.6 9.6 12.7 15 12.4C23 12.05 41 12.05 49 12.4C54.4 12.7 59 15.6 59 20.5V45.37A2.5 2.5 0 0 1 56.5 47.87H7.5A2.5 2.5 0 0 1 5 45.37Z" fill="#dcd8cb"/>
    <rect x="7.4" y="24" width=".9" height="12.5" rx=".45" fill="#b6af9c"/>
    <rect x="9.6" y="24" width=".9" height="12.5" rx=".45" fill="#b6af9c"/>
    <rect x="11.8" y="24" width=".9" height="12.5" rx=".45" fill="#b6af9c"/>
    <rect x="51.4" y="24" width=".9" height="12.5" rx=".45" fill="#b6af9c"/>
    <rect x="53.6" y="24" width=".9" height="12.5" rx=".45" fill="#b6af9c"/>
    <rect x="55.8" y="24" width=".9" height="12.5" rx=".45" fill="#b6af9c"/>
    <rect x="15.2" y="19" width="33.6" height="22.6" rx="1.7" fill="#b6af9c"/>
    <rect x="16" y="19.8" width="32" height="21" rx="1.2" fill="#5647cb"/>
    <path d="M26.9 21.8H37.1V32H30.3V38.8H26.9ZM30.3 25.2H33.7V28.6H30.3Z" fill="#efece3" fill-rule="evenodd"/>
  </g>
</svg>
