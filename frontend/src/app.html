<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%sveltekit.assets%/favicon-32.png" sizes="32x32" />
    <link rel="icon" href="%sveltekit.assets%/favicon-16.png" sizes="16x16" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      Silkscreen, et pas Press Start 2P : celle-ci est la police 8-bit par
      défaut de tout projet rétro - donc un tell plutôt qu'un choix - et elle
      est NES, pas SNES. Silkscreen est plus blocky, plus proche des
      logotypes 16-bit, et elle a des minuscules, ce qui évite les capitales
      forcées. Réservée aux petits titres : une police pixel en paragraphe
      est illisible, et le corps de texte reste en sans système.

      `display=swap` pour que le texte s'affiche tout de suite dans la police
      de secours plutôt que de laisser un trou pendant le chargement.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Pixelify+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#5647cb" />
    <meta name="description" content="Play SNES games online with friends" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.json" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PSNES" />

    <!-- The shell is all a crawler ever gets: `ssr = false`, so no route runs
         for anyone who does not execute our JavaScript. Pages retitle the tab
         from here via `setPageTitle`, which assigns `document.title` rather
         than adding a second <title> - the first one in the head is the one
         the document keeps, so a `<svelte:head>` title would lose to this. -->
    <title>PSNES - Play classic SNES games with your friends</title>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
