server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Increase max upload size for ROM files (up to 10MB)
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Proxy settings for backend API
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy settings for authentication
    location /auth/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket proxy for socket.io
    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Les jaquettes, servies depuis le volume que l'ingestion remplit.
    #
    # Un fichier est nommé par l'empreinte de ses octets sources, donc remplacer
    # une jaquette produit une URL différente : `immutable` dit la vérité ici
    # plutôt qu'un espoir, et rien n'a jamais à être invalidé nulle part.
    #
    # Et surtout : ça ne passe pas par Bun. L'ancien chemin, /api/covers/<id>,
    # était derrière requireAuth - donc une réponse qu'aucun cache n'a le droit
    # de garder, et les 1415 jaquettes repartaient du VPS à chaque visite. Ici
    # un edge répond à la place de l'origine.
    #
    # Mesuré le 13/09/2026 : 266 Ko de PNG médian deviennent 46 Ko de WebP, et
    # 7 Ko pour la vignette que la liste d'identification dessine en 40x30.
    location /covers/ {
        alias /var/www/covers/;

        # `add_header` seul, SANS `expires 1y` à côté.
        #
        # Mesuré en lançant nginx avec cette configuration : les deux directives
        # ensemble émettent DEUX en-têtes Cache-Control, `max-age=31536000` puis
        # `public, max-age=31536000, immutable`. Un cache qui retient le premier
        # perd `immutable` - c'est-à-dire précisément ce que le nommage par
        # empreinte a été construit pour pouvoir promettre.
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;

        # Une jaquette pas encore ingérée n'a pas de fichier ici ; la carte
        # retombe sur son étiquette de cartouche plutôt que sur une page 404.
        try_files $uri =404;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The emulator core module.
    #
    # nginx's mime.types has no entry for .mjs, so it was served as
    # application/octet-stream - and a browser refuses to execute that as an ES
    # module, which surfaces as "Failed to fetch dynamically imported module"
    # even though the file downloads fine. The empty `types` block is scoped to
    # this location, so emptying the map here cannot affect anything else.
    location ~* \.mjs$ {
        types { }
        default_type text/javascript;
        add_header Cache-Control "no-cache";
    }

    location ~* \.wasm$ {
        add_header Cache-Control "no-cache";
    }

    # Note on the two blocks above: no `immutable`, deliberately.
    #
    # Vite's own output can be immutable because its filenames carry a content
    # hash. These two do not - psnes_core.mjs keeps its name across rebuilds -
    # so an immutable year-long cache pins a visitor to whichever core they
    # happened to fetch first, with no way back short of clearing site data.
    # For netplay that is worse than a stale asset: two players on different
    # core builds are two different state machines, which is precisely the
    # desync the deterministic core exists to prevent.
    #
    # `no-cache` still stores the file; it just revalidates, and an unchanged
    # 3MB core comes back as a 304.

    # Service worker - no cache
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # SPA fallback - serve index.html for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
