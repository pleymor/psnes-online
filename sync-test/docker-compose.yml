version: '3.8'

services:
  sync-test:
    image: mcr.microsoft.com/playwright:v1.57.0-noble
    working_dir: /app/sync-test
    volumes:
      - ..:/app
      - /app/sync-test/node_modules
    command: >
      bash -c "
        cd /app/sync-test &&
        npm install &&
        npx playwright install chromium &&
        node test-sync.js --verbose
      "
    environment:
      - CI=true
